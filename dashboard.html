<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="assets/css/inter-font.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/fontawesome.css">
    <!-- Chart.js for graphs -->
    <script src="utils/chart.js"></script>
    <!-- Immediate Layout Cache Injection to Prevent Page Navigation Flicker -->
    <script>
        (() => {
            try {
                const cachedHeader = sessionStorage.getItem('component-header.html');
                const cachedFooter = sessionStorage.getItem('component-footer.html');
                if (!cachedHeader && !cachedFooter) return;
                
                const observer = new MutationObserver((mutations, obs) => {
                    const headerEl = cachedHeader ? document.getElementById('header-placeholder') : null;
                    const footerEl = cachedFooter ? document.getElementById('footer-placeholder') : null;
                    
                    if (headerEl && headerEl.getAttribute('data-fully-loaded') !== 'true') {
                        const doc = new DOMParser().parseFromString(cachedHeader, 'text/html');
                        const scripts = Array.from(doc.querySelectorAll('script'));
                        headerEl.innerHTML = '';
                        while (doc.body.firstChild) headerEl.appendChild(doc.body.firstChild);
                        
                        // Hydrate login/logout visibility state immediately to prevent visual flicker
                        const loginData = localStorage.getItem('loginData');
                        if (loginData) {
                            const loginBtn = headerEl.querySelector('#login-button');
                            if (loginBtn) loginBtn.classList.add('hidden');
                            
                            const publicNav = headerEl.querySelector('#container-desktop-public');
                            if (publicNav) publicNav.classList.add('hidden');
                            
                            const globalNotif = headerEl.querySelector('#notification-container-global');
                            if (globalNotif) globalNotif.classList.remove('hidden');

                            const searchBtn = headerEl.querySelector('#nav-search-private');
                            if (searchBtn) searchBtn.classList.remove('hidden');

                            const pincodeBtn = headerEl.querySelector('#nav-pincode-private');
                            if (pincodeBtn) pincodeBtn.classList.remove('hidden');

                            const privateNav = headerEl.querySelector('#container-desktop-private');
                            if (privateNav) {
                                privateNav.classList.remove('hidden');
                                privateNav.classList.add('flex');
                            }

                            const desktopLogout = headerEl.querySelector('#desktop-logout-button');
                            if (desktopLogout) {
                                desktopLogout.classList.remove('hidden');
                                desktopLogout.style.display = window.innerWidth >= 1280 ? 'flex' : 'none';
                            }
                            
                            const sidebarToggle = headerEl.querySelector('#sidebar-toggle-container');
                            if (sidebarToggle) sidebarToggle.classList.remove('hidden');
                        }
                        
                        scripts.forEach(script => {
                            const newScript = document.createElement('script');
                            if (script.src) newScript.src = script.src;
                            else newScript.textContent = script.textContent;
                            document.head.appendChild(newScript);
                        });
                        headerEl.setAttribute('data-fully-loaded', 'true');
                    }
                    
                    if (footerEl && footerEl.getAttribute('data-fully-loaded') !== 'true') {
                        const doc = new DOMParser().parseFromString(cachedFooter, 'text/html');
                        const scripts = Array.from(doc.querySelectorAll('script'));
                        footerEl.innerHTML = '';
                        while (doc.body.firstChild) footerEl.appendChild(doc.body.firstChild);
                        
                        scripts.forEach(script => {
                            const newScript = document.createElement('script');
                            if (script.src) newScript.src = script.src;
                            else newScript.textContent = script.textContent;
                            document.head.appendChild(newScript);
                        });
                        footerEl.setAttribute('data-fully-loaded', 'true');
                    }
                    
                    if ((!cachedHeader || (headerEl && headerEl.getAttribute('data-fully-loaded') === 'true')) &&
                        (!cachedFooter || (footerEl && footerEl.getAttribute('data-fully-loaded') === 'true'))) {
                        obs.disconnect();
                    }
                });
                
                observer.observe(document.documentElement, { childList: true, subtree: true });
            } catch (_) {}
        })();
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <div id="header-placeholder" style="min-height:56px"><div class="animate-pulse bg-gray-200 h-14 w-full"></div></div>

    <main class="flex-grow p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto w-full">
        <!-- Branded Title -->
        <div class="flex flex-col items-center mb-6">
            <h1 class="pagetitle">Dashboard</h1>
            <div class="pagetitle-bar"></div>
        </div>

        <!-- 2-Column Layout: Stacked Graphs on Left, Recent Orders on Right -->
        <div class="dashboard-layout-grid">
            <!-- Left Side: Stacked Graph Cards -->
            <div class="dashboard-left-graphs">
                <!-- Graph 1: Bookings — Last X Days -->
                <div class="rn-tray">
                    <div class="rn-tray-header">
                        <div class="rn-tray-accent"></div>
                        <span class="rn-tray-title" id="bookings-tray-title">Bookings — Last 15 Days</span>
                    </div>
                    <div id="bookings-bar-container" class="flex justify-around items-end h-[105px] pt-1">
                        <div class="text-slate-400 text-xs text-center py-6 w-full">Loading bookings...</div>
                    </div>
                </div>

                <!-- Graph 2: Service Level -->
                <div class="rn-tray">
                    <div class="rn-tray-header">
                        <div class="rn-tray-accent"></div>
                        <span class="rn-tray-title">Service Level</span>
                        <div class="rn-tray-right">
                            <div class="rn-tray-stat">
                                <span class="rn-tray-stat-val" id="sla-avg-badge">Avg 0%</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-3 sm:gap-4 mb-2.5" id="sla-legend-container">
                        <div class="flex items-center gap-1.5 text-xs text-slate-500 font-semibold"><span class="w-2 h-2 rounded-full bg-[#2563eb]"></span>Ordered</div>
                        <div class="flex items-center gap-1.5 text-xs text-slate-500 font-semibold"><span class="w-2 h-2 rounded-full bg-[#059669]"></span>Delivered</div>
                        <div class="flex items-center gap-1.5 text-xs text-slate-500 font-semibold"><span class="w-2 h-2 rounded-full bg-[#f59e0b]"></span>In Transit</div>
                        <div class="flex items-center gap-1.5 text-xs text-slate-500 font-semibold"><span class="w-2 h-2 rounded-full bg-[#8b5cf6]"></span>Out for Delivery</div>
                    </div>
                    <div id="sla-chart-container" class="w-full relative h-[140px]"></div>
                </div>

                <!-- Graph 3: Top Destinations -->
                <div class="rn-tray">
                    <div class="rn-tray-header">
                        <div class="rn-tray-accent"></div>
                        <span class="rn-tray-title">Top Destinations</span>
                    </div>
                    <div id="destinations-chart-container" class="w-full relative h-[155px]"></div>
                </div>
            </div>

            <!-- Right Side: Recent Orders Card -->
            <div class="dashboard-right-orders">
                <div class="rn-tray">
                    <div class="rn-tray-header">
                        <div class="rn-tray-accent"></div>
                        <span class="rn-tray-title">Recent Orders</span>
                        <div class="rn-tray-right">
                            <a href="orders.html" class="text-xs font-bold text-[#9C2007] hover:underline">View All →</a>
                        </div>
                    </div>
                    <div id="recent-orders-container" class="space-y-1">
                        <div class="text-slate-400 text-xs text-center py-6">Loading recent orders...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder" class="mt-auto" style="min-height:26px"><div class="animate-pulse bg-gray-200 h-7 w-full"></div></div>

    <div id="contactModal" class="modal-overlay hidden">
        <div class="modal-content relative card">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Contact Details</h2>
            <button id="closeContactModalButton" class="btn-close absolute top-4 right-4" aria-label="Close">✕</button>
            <div class="space-y-4 text-gray-700">
                <div><h3 class="font-medium">Address:</h3><p class="text-gray-600" data-branch-address>Shivlok Colony, Haripur, Dehradun - 248001</p></div>
                <div><h3 class="font-medium">Email:</h3><p class="text-gray-600" data-branch-email>support@post4ex.in</p></div>
            </div>
        </div>
    </div>

    <!-- Service Content Area -->
    <div id="services-content-area" class="hidden"></div>

    
    <script src="core/indexeddb.js"></script>
    <script src="core/app-config.js"></script>
    <script src="core/formatIST.js"></script>
    <script src="core/app-notify.js"></script>
    <script src="core/app-api.js"></script>
    <script src="core/app-auth.js"></script>
    <script src="core/layout.js"></script>
    <script src="jawaS/dashboard.js"></script>
    <script>
        // Service loading function
        window.loadService = function(url) {
            const servicesArea = document.getElementById('services-content-area');
            if(servicesArea) {
                servicesArea.classList.remove('hidden');
                if (typeof window.loadDynamicContent === 'function') {
                    loadDynamicContent(url, 'services-content-area');
                }
                servicesArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        };

        window.openContactModal = function() {
            const modal = document.getElementById('contactModal');
            if(modal) {
                modal.classList.remove('hidden');
                setTimeout(() => modal.classList.add('active'), 10);
            } else {
                console.warn("Contact Modal not found. It might still be loading from the footer.");
                showNotification("Contact details are loading...", "info");
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Dashboard init — no complaint form needed here
        });
    </script>
</body>
</html>
